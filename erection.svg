<text x="40" y="215.0">~12 flat-packed 3 m mast sections per module;</text>
<text x="40" y="231.0">35 sections = 3 modules (vs ~10 rigid).</text>
<text x="40" y="255.0">Whole rig ≈ 25 modules: tent-pole struts,</text>
<text x="40" y="271.0">base pivot + base frame, packs, reels.</text>
<text x="20" y="330" class="t">2. Flat-pack section unfolds at the jack frame</text>
<line x1="60" y1="460" x2="210" y2="460" stroke="#c87f0a" stroke-width="5"/><text x="135" y="484" text-anchor="middle" font-size="11.5">folded (end view, ~0.12 m)</text>
<path d="M260 460 H320" class="l" marker-end="url(#ar)"/>
<polygon points="342,460 438,460 390,377" fill="none" stroke="#c87f0a" stroke-width="5"/>
<circle cx="342" cy="460" r="5" fill="#fff" class="s"/>
<circle cx="438" cy="460" r="5" fill="#fff" class="s"/>
<circle cx="390" cy="377" r="6" fill="#f5b700" stroke="#222"/>
<text x="390" y="484" text-anchor="middle" font-size="11.5">unfolded triangle, 1.4 m face</text>
<path d="M398 374 L460 350" class="l"/><text x="462" y="354" font-size="11.5">pin the open edge</text><text x="462" y="368" font-size="11.5">(captive pin, one tool)</text>
<text x="60" y="520" font-size="11.5">Faces hinged on two chords; the third chord is pinned on site.</text>
<text x="60" y="536" font-size="11.5">Then the section is pushed into the bottom of the mast.</text>
<text x="560" y="32" class="t">3. Jack-up: top yard fitted first, rigged, rides up</text>
