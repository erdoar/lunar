<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Rotating Platform</title>
<meta name="description" content="Concept design for a tall rotating solar platform at a lunar pole.">
<style>
  :root { --bg:#0b0d10; --fg:#e6e8eb; --muted:#9aa3ad; --line:#252a31; --accent:#f2c14e; --code:#14181d; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#fbfbfa; --fg:#1b1e22; --muted:#5b636c; --line:#e3e5e8; --accent:#9a6a00; --code:#f1f2f4; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .hero { position:relative; min-height:72vh; display:flex; align-items:flex-end; background:#000 url(renders/03_ground_hero.jpg) center/cover; }
  .hero::after { content:""; position:absolute; inset:0; background:linear-gradient(transparent 40%, rgba(0,0,0,.85)); }
  .hero div { position:relative; z-index:1; max-width:900px; margin:0 auto; padding:32px 16px; color:#fff; width:100%; }
  .hero h1 { font-size:clamp(2rem,6vw,3.6rem); line-height:1.05; margin:0 0 .4em; letter-spacing:-.02em; }
  .hero p { margin:0; max-width:40em; color:#d5d9de; }
  .layout { max-width:1200px; margin:0 auto; padding:0 16px; display:grid; grid-template-columns:240px minmax(0,1fr); gap:48px; }
  nav { position:sticky; top:0; align-self:start; max-height:100vh; overflow:auto; padding:32px 0; font-size:.85rem; }
  nav a { display:block; color:var(--muted); text-decoration:none; padding:3px 0; }
  nav a:hover { color:var(--accent); }
  nav a.sub { padding-left:12px; }
  main { padding:32px 0 96px; min-width:0; }
  main > h1:first-child, main > p:first-of-type img { display:none; }
  h2 { margin-top:2.6em; padding-top:.6em; border-top:1px solid var(--line); }
  a { color:var(--accent); }
  img { max-width:100%; height:auto; border-radius:6px; background:#fff; }
  img[src^="renders/"] { background:none; }
  table { border-collapse:collapse; width:100%; display:block; overflow-x:auto; font-size:.9rem; }
  th, td { border:1px solid var(--line); padding:6px 10px; vertical-align:top; }
  code { background:var(--code); padding:1px 5px; border-radius:4px; font-size:.88em; }
  pre { background:var(--code); padding:12px; overflow-x:auto; border-radius:6px; }
  pre code { padding:0; }
  footer { color:var(--muted); font-size:.85rem; text-align:center; padding:32px 16px; border-top:1px solid var(--line); }
  @media (max-width:860px) { .layout { grid-template-columns:1fr; } nav { display:none; } }
</style>
</head>
<body>
<header class="hero"><div>
  <h1>Lunar rotating solar platform</h1>
  <p>A 108 m mast that turns on a single pivot to follow the Sun at a lunar pole, with ~960 m² of solar array at the top and bots that swap panels. A concept design, rev 33.</p>
</div></header>
<div class="layout">
  <nav id="toc" aria-label="Contents"></nav>
  <main id="doc">Loading…</main>
</div>
<footer>Concept design. Sizing figures are starting points, not verified engineering.</footer>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
fetch("DESIGN.md").then(r => r.text()).then(md => {
  const doc = document.getElementById("doc");
  doc.innerHTML = marked.parse(md);
  const toc = document.getElementById("toc");
  doc.querySelectorAll("h2, h3").forEach((h, i) => {
    h.id = h.id || "s" + i;
    const a = document.createElement("a");
    a.href = "#" + h.id;
    a.textContent = h.textContent;
    if (h.tagName === "H3") a.className = "sub";
    toc.appendChild(a);
  });
  doc.querySelectorAll("img").forEach(img => { img.loading = "lazy"; });
}).catch(() => { document.getElementById("doc").textContent = "Could not load the design document."; });
</script>
</body>
</html>
