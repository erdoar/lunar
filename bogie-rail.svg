<text x="230" y="464" text-anchor="middle">~11 m clear rail between bogies</text>
<text x="230" y="480" text-anchor="middle">(3 full segments free)</text>
<path d="M252 94L290 72" class="l"/>
<text x="294" y="76" text-anchor="start">Bogie 1.3 m, 2 tyres;</text>
<text x="294" y="91" text-anchor="start">axles point at centre</text>
<text x="294" y="106" text-anchor="start">(fan ~8.6°)</text>
<text x="230" y="278" text-anchor="middle" font-size="11">kingpin</text>
<text x="230" y="298" text-anchor="middle" font-size="12">Ø12 m rail,</text><text x="230" y="313" text-anchor="middle" font-size="12">12 segments of π m</text>
<text x="560" y="30" class="t">Side view: one bogie (right tyre out, shoe down)</text>
<rect x="535.0" y="90" width="510.0" height="34" class="deck s"/><text x="550.0" y="112">Rotating deck</text>
<rect x="764" y="124" width="52" height="34" fill="#fff" class="s"/><circle cx="790" cy="184" r="16" class="frame s"/>
