<rect x="754.0" y="341" width="72.0" height="20" class="rail s"/><rect x="520.0" y="361" width="540.0" height="40" class="rail s"/>
<line x1="1015.0" y1="315" x2="1030.0" y2="329" stroke="#fff" stroke-width="3"/>
<path d="M806 184L910 140" class="l"/>
<text x="914" y="144" text-anchor="start">Spherical centre pivot</text>
<text x="914" y="159" text-anchor="start">= load equaliser, ±20 mm radial float</text>
<path d="M583 260L505 218" class="l"/>
<text x="501" y="222" text-anchor="end">Support shoe on screw,</text>
<text x="501" y="237" text-anchor="end">3 mm above rail</text>
<path d="M1017 308L1075 275" class="l"/>
<text x="1079" y="279" text-anchor="start">Shoe down: carries</text>
<text x="1079" y="294" text-anchor="start">the load for a swap</text>
<path d="M945 240L1075 190" class="l"/>
<text x="1079" y="194" text-anchor="start">Tyre slid off</text>
<text x="1079" y="209" text-anchor="start">outward</text>
<path d="M611 260L505 258" class="l"/>
<text x="501" y="262" text-anchor="end">Tyre Ø300</text>
<path d="M766 349L505 367" class="l"/>
<text x="501" y="371" text-anchor="end">Uplift rollers (2)</text>
<path d="M586 307L505 329" class="l"/>
<text x="501" y="333" text-anchor="end">Scraper</text>
<path d="M1021 322L1075 375" class="l"/>
<text x="1079" y="379" text-anchor="start">Wear strip joint</text>
<path d="M640 322L700 419" class="l"/>
<text x="696" y="423" text-anchor="end">Flat rail head wear strip (red), π m long</text>
<text x="470" y="490" class="t">Section through a tyre (ring centre to the left)</text>
<rect x="480" y="510" width="420" height="30" class="deck s"/>
<rect x="590" y="540" width="60" height="70" class="frame s"/>
<g transform="rotate(-5.7 732 602)">
<rect x="650" y="590" width="26" height="30" fill="#555" class="s"/>
<rect x="676" y="596" width="122" height="13" fill="#555" class="s"/>
<polygon points="692,558 772,550 772,654 692,646" class="tyre s"/>
<rect x="708" y="582" width="48" height="40" fill="#ddd" stroke="#222"/>
<polygon points="772,593 796,593 800,602 796,611 772,611" fill="#333"/>
</g>
<rect x="676" y="650" width="104" height="16" class="head s"/>
<rect x="716" y="666" width="24" height="24" class="rail s"/><rect x="684" y="690" width="90" height="70" class="rail s"/>
<rect x="716" y="760" width="26" height="40" class="pier s"/>
<rect x="620" y="610" width="12" height="76" class="frame s"/><circle cx="682" cy="678" r="8" class="cart s"/><line x1="632" y1="676" x2="674" y2="678" stroke="#555" stroke-width="4"/>
<line x1="480" y1="650" x2="676" y2="650" stroke="#888" stroke-dasharray="4 4"/>
<path d="M815 570 H875" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><text x="817" y="562" font-size="12">slides off</text>
<path d="M620 560L530 580" class="l"/>
<text x="526" y="584" text-anchor="end">Bogie frame</text>
<text x="526" y="599" text-anchor="end">(inboard)</text>
<path d="M684 602L610 746" class="l"/>
<text x="606" y="750" text-anchor="end">Stub axle tipped ~1.4° down</text>
<text x="606" y="765" text-anchor="end">toward the centre (drawn ~6°)</text>
<path d="M500 650L500 690" class="l"/>
<text x="496" y="694" text-anchor="end">Rail-top plane runs to the</text>
<text x="496" y="709" text-anchor="end">ring centre = cone apex</text>
<path d="M732 556L810 530" class="l"/>
<text x="814" y="534" text-anchor="start">Conical tread, half-angle ~1.4°</text>
<path d="M794 608L850 622" class="l"/>
<text x="854" y="626" text-anchor="start">Captive hub nut</text>
<path d="M750 620L850 650" class="l"/>
<text x="854" y="654" text-anchor="start">Wheel cartridge: hub, sealed</text>
<text x="854" y="669" text-anchor="start">hybrid bearing, MoS₂, steel tread</text>
<path d="M775 658L850 694" class="l"/>
<text x="854" y="698" text-anchor="start">Flat rail head wear strip,</text>
<text x="854" y="713" text-anchor="start">ceramic/DLC coated</text>
<path d="M682 686L620 716" class="l"/>
<text x="616" y="720" text-anchor="end">Uplift roller</text>
<path d="M770 740L850 745" class="l"/>
<text x="854" y="749" text-anchor="start">Box beam rail on pier</text>
<text x="480" y="798" font-size="12">Load on each tyre is vertical (tripod + kingpin take all side loads), so tyres are not tilted outward.</text>
<text x="20" y="520" class="t">Swapping a tyre</text>
<text x="20" y="546" font-size="13">1. Stop and lock the drive.</text>
<text x="20" y="565" font-size="13">2. Wind the support shoe down until it</text>
<text x="20" y="584" font-size="13">    takes the load; tyre lifts ~5 mm.</text>
<text x="20" y="603" font-size="13">3. Undo the captive hub nut; slide the</text>
<text x="20" y="622" font-size="13">    wheel cartridge off outward.</text>
<text x="20" y="641" font-size="13">4. Slide the spare on, tighten, wind the</text>
<text x="20" y="660" font-size="13">    shoe back to its 3 mm standoff.</text>
<text x="20" y="679" font-size="13">Wheel cartridge ~12 kg (~2 kg-weight</text>
<text x="20" y="698" font-size="13">on the Moon). No deck jacking.</text>
<text x="20" y="717" font-size="13">If a tyre fails in service, its shoe</text>
<text x="20" y="736" font-size="13">lands on the rail: the bogie never drops.</text>
</svg>