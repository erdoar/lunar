<text x="854" y="689" text-anchor="start">Conical rail head wear strip,</text>
<text x="854" y="704" text-anchor="start">ceramic/DLC coated</text>
<path d="M684 680L610 700" class="l"/>
<text x="606" y="704" text-anchor="end">Uplift roller</text>
<path d="M770 730L850 735" class="l"/>
<text x="854" y="739" text-anchor="start">Box beam rail on pier</text>
<text x="20" y="520" class="t">Swapping a tyre</text>
<text x="20" y="546" font-size="13">1. Stop and lock the drive.</text>
<text x="20" y="565" font-size="13">2. Wind the retract screw: tyre lifts</text>
<text x="20" y="584" font-size="13">    ~20 mm, its load goes to the other 3.</text>
<text x="20" y="603" font-size="13">3. Undo the captive hub nut; slide the</text>
<text x="20" y="622" font-size="13">    wheel cartridge off outward.</text>
<text x="20" y="641" font-size="13">4. Slide the spare on, tighten, wind the</text>
<text x="20" y="660" font-size="13">    screw back to the spring-load mark.</text>
<text x="20" y="679" font-size="13">Wheel cartridge ~10 kg (under 2 kg-weight</text>
<text x="20" y="698" font-size="13">on the Moon). No deck jacking.</text>
</svg>