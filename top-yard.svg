<text x="60" y="865" font-size="12">One shaft, 4 grooved traction sheaves (Ø0.4 m, 3 wraps): exactly equal stroke on all 4 halyards, so both wings move together and stay level.</text>
<text x="60" y="883" font-size="12">0.1 m/s = 4.8 rpm, ~890 N·m; 2 x 0.5 kW motors (either suffices), spring-applied brake, load cells and encoders on every halyard.</text>
