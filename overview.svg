<text x="110" y="236" text-anchor="end">Solar wings, 70–100 m</text>
<text x="110" y="250" text-anchor="end">(2 x 17 x 30 m, ~350 kW)</text>
<path d="M188 170L114 145" class="l"/>
<text x="110" y="149" text-anchor="end">Top yard, 100 m</text>
<path d="M250 127L300 96" class="l"/>
<text x="304" y="100" text-anchor="start">Mast, 108 m</text>
<path d="M260 406L337 393" class="l"/>
<text x="341" y="397" text-anchor="start">Upper collar 62 m + stay cables</text>
<path d="M260 573L337 554" class="l"/>
<text x="341" y="558" text-anchor="start">Strut collar 35 m + A-frame struts</text>
<path d="M436 786L442 680" class="l"/>
<text x="446" y="684" text-anchor="start">Foot pad, 30 m out</text>
<path d="M255 782L312 720" class="l"/>
<text x="316" y="724" text-anchor="start">Single base bearing +</text>
<text x="316" y="738" text-anchor="start">rotating base frame (see right)</text>
<text x="30" y="848" font-size="12">Turns (once per lunar day): <tspan fill="#e67e22" font-weight="bold">orange</tspan> + <tspan fill="#2c4a7a" font-weight="bold">blue</tspan>.  Fixed: <tspan fill="#7d8790" font-weight="bold">grey</tspan>, <tspan fill="#4a9" font-weight="bold">green</tspan> collars, purple cables.</text>
<text x="560" y="30" class="t">Base close-up: what attaches to what</text>
<text x="560" y="48" font-size="11.5">Section through the mast foot (full detail in base.svg)</text>
<rect x="560" y="520" width="600" height="40" fill="url(#g)"/><line x1="560" y1="520" x2="1160" y2="520" stroke="#222"/>
<path d="M710 520 L792.5 437.5 H927.5 L1010 520 Z" fill="#7d8790" class="s"/>
<path d="M797.0 437.5 A90.0 37.5 0 0 0 923.0 437.5" fill="#bbb" class="s"/>
<rect x="797.0" y="377.5" width="126.0" height="60.0" fill="#7d8790" class="s"/>
<rect x="810.5" y="400.0" width="99.0" height="12.0" fill="#e67e22" stroke="#222"/>
<rect x="849.5" y="340.0" width="21.000000000000004" height="112.5" fill="#bfa6d9" class="s"/>
<rect x="725.5" y="377.5" width="44" height="34" fill="#7fa3d6" class="s"/>
<line x1="725.0" y1="511.0" x2="560" y2="511.0" stroke="#c87f0a" stroke-width="2" stroke-dasharray="6 3"/>
<rect x="950.5" y="377.5" width="44" height="34" fill="#7fa3d6" class="s"/>
