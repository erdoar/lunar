<path d="M917 439L1154 410" class="l"/><circle cx="1154" cy="410" r="10" fill="#fff" stroke="#222"/><text x="1154" y="414" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">4</text>
<path d="M1037 445L1154 455" class="l"/><circle cx="1154" cy="455" r="10" fill="#fff" stroke="#222"/><text x="1154" y="459" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">5</text>
<path d="M765 350L595 310" class="l"/><circle cx="595" cy="310" r="10" fill="#fff" stroke="#222"/><text x="595" y="314" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">7</text>
<path d="M632 249L592 199" class="l"/><circle cx="592" cy="199" r="10" fill="#fff" stroke="#222"/><text x="592" y="203" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">8</text>
<path d="M680 529L570 559" class="l"/><circle cx="570" cy="559" r="10" fill="#fff" stroke="#222"/><text x="570" y="563" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">9</text>
<path d="M659 331L599 371" class="l"/><circle cx="599" cy="371" r="10" fill="#fff" stroke="#222"/><text x="599" y="375" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">10</text>
<circle cx="572" cy="596" r="9" fill="#fff" stroke="#222"/><text x="572" y="600" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">1</text>
<text x="586" y="600" font-weight="bold">Mast → cup</text><text x="586" y="614" font-size="11.5">The mast foot plate (where the 3 legs meet) holds the concave wear cup, facing down.</text>
<circle cx="572" cy="627" r="9" fill="#fff" stroke="#222"/><text x="572" y="631" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">2</text>
<text x="586" y="631" font-weight="bold">Wear cup</text><text x="586" y="645" font-size="11.5">Dry-lubricated, replaceable; conductive layers inside read wear depth electrically.</text>
<circle cx="572" cy="658" r="9" fill="#fff" stroke="#222"/><text x="572" y="662" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">3</text>
<text x="586" y="662" font-weight="bold">Pivot ball</text><text x="586" y="676" font-size="11.5">Hard convex ball R 0.25 m, fixed, facing up: carries ~9.9 kN; dust and debris fall off it.</text>
<circle cx="572" cy="689" r="9" fill="#fff" stroke="#222"/><text x="572" y="693" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">4</text>
<text x="586" y="693" font-weight="bold">Ball → foundation</text><text x="586" y="707" font-size="11.5">Pedestal with drip flange on the foundation frame (~2 x 2 m pad); 3 keeper hooks.</text>
<circle cx="572" cy="720" r="9" fill="#fff" stroke="#222"/><text x="572" y="724" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">5</text>
<text x="586" y="724" font-weight="bold">Drive</text><text x="586" y="738" font-size="11.5">2 self-locking worm motors (slip clutch ~300 N·m) on the frame drive a pin-ring gear.</text>
<circle cx="572" cy="751" r="9" fill="#fff" stroke="#222"/><text x="572" y="755" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">6</text>
<text x="586" y="755" font-weight="bold">Pin-ring gear</text><text x="586" y="769" font-size="11.5">Ø1.2 m lantern gear under the foot plate; tolerates dust and the ±1° pivot tilt.</text>
<circle cx="572" cy="782" r="9" fill="#fff" stroke="#222"/><text x="572" y="786" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">7</text>
<text x="586" y="786" font-weight="bold">Slip ring</text><text x="586" y="800" font-size="11.5">Annular, Ø0.9 m, around the pivot: rotor under the foot plate, stator on the frame.</text>
<circle cx="572" cy="813" r="9" fill="#fff" stroke="#222"/><text x="572" y="817" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">8</text>
<text x="586" y="817" font-weight="bold">Base frame → mast</text><text x="586" y="831" font-size="11.5">The Ø3 m rotating base frame clamps to the bottom mast section ~1.5 m up (battery, bot dock, power).</text>
<circle cx="572" cy="844" r="9" fill="#fff" stroke="#222"/><text x="572" y="848" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">9</text>
<text x="586" y="848" font-weight="bold">Ties → foundation</text><text x="586" y="862" font-size="11.5">The 3 ground ties from the strut feet end on lugs on the foundation frame and cancel out.</text>
<circle cx="572" cy="875" r="9" fill="#fff" stroke="#222"/><text x="572" y="879" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">10</text>
<text x="586" y="879" font-weight="bold">Jack frame</text><text x="586" y="893" font-size="11.5">Bolted to the foundation frame: erection, then lifts the mast ~10 mm for a cup swap.</text>
<text x="560" y="78" font-size="12"><tspan fill="#e67e22" font-weight="bold">Turns:</tspan> mast, foot plate, wear cup, pin ring, base frame.   <tspan fill="#7d8790" font-weight="bold">Fixed:</tspan> ball, foundation, drives, ties.</text>
<text x="560" y="96" font-size="12">Weight path: mast → foot plate → wear cup → pivot ball → foundation frame → pad → regolith.</text>
</svg>