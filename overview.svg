<line x1="1134.9" y1="360.7069306930693" x2="1174.8" y2="275.0" stroke="#e67e22" stroke-width="2"/>
<rect x="1171.0" y="265.5" width="38.0" height="66.5" fill="#e67e22" class="s"/>
<line x1="1213.75" y1="294.0" x2="1213.75" y2="404.20000000000005" stroke="#999" stroke-width="3" stroke-dasharray="3 2"/>
<circle cx="1190" cy="345.3" r="8" fill="#fff" class="s"/>
<rect x="1147.25" y="354.79999999999995" width="85.5" height="24.7" fill="#e0a040" class="s"/>
<circle cx="1190" cy="383.29999999999995" r="17.099999999999998" fill="#bbb" class="s"/><circle cx="1190" cy="383.29999999999995" r="3" fill="#222"/>
<line x1="1153.9" y1="379.5" x2="1153.9" y2="442.2" stroke="#555" stroke-width="3"/><circle cx="1161.5" cy="442.2" r="5" fill="#4a9" class="s"/>
<rect x="1166.25" y="408.0" width="47.5" height="9.5" fill="#c0392b"/>
<rect x="1171.0" y="417.5" width="38.0" height="47.5" fill="#7d8790" class="s"/>
<rect x="1180.5" y="465.0" width="19.0" height="85.5" fill="#ccc" class="s"/>
<rect x="1161.5" y="550.5" width="57.0" height="9.5" fill="#999"/>
