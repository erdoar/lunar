<text x="1247.0" y="568.5" font-size="11">tie → strut foot, 30 m</text>
<path d="M1214 412L1254 442" class="l"/><circle cx="1254" cy="442" r="10" fill="#fff" stroke="#222"/><text x="1254" y="446" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">1</text>
<path d="M1162 442L1132 482" class="l"/><circle cx="1132" cy="482" r="10" fill="#fff" stroke="#222"/><text x="1132" y="486" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">2</text>
<path d="M1190 345L1235 335" class="l"/><circle cx="1235" cy="335" r="10" fill="#fff" stroke="#222"/><text x="1235" y="339" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">3</text>
<path d="M1176 294L1166 234" class="l"/><circle cx="1166" cy="234" r="10" fill="#fff" stroke="#222"/><text x="1166" y="238" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">4</text>
<path d="M696 370L726 300" class="l"/><circle cx="726" cy="300" r="10" fill="#fff" stroke="#222"/><text x="726" y="304" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">5</text>
<path d="M620 271L580 231" class="l"/><circle cx="580" cy="231" r="10" fill="#fff" stroke="#222"/><text x="580" y="235" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">6</text>
<path d="M648 435L688 465" class="l"/><circle cx="688" cy="465" r="10" fill="#fff" stroke="#222"/><text x="688" y="469" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">7</text>
<path d="M1190 465L1230 485" class="l"/><circle cx="1230" cy="485" r="10" fill="#fff" stroke="#222"/><text x="1230" y="489" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">8</text>
<path d="M620 550L575 580" class="l"/><circle cx="575" cy="580" r="10" fill="#fff" stroke="#222"/><text x="575" y="584" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">9</text>
<circle cx="572" cy="636" r="9" fill="#fff" stroke="#222"/><text x="572" y="640" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">1</text>
<text x="586" y="640" font-weight="bold">Tyres → rail head</text><text x="586" y="654" font-size="11.5">The 2 tyres of each bogie roll on the rail's wear strip (red).</text>
<circle cx="572" cy="666" r="9" fill="#fff" stroke="#222"/><text x="572" y="670" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">2</text>
<text x="586" y="670" font-weight="bold">Uplift rollers → under the rail head</text><text x="586" y="684" font-size="11.5">Captive hooks against quake bounce; normally unloaded.</text>
<circle cx="572" cy="696" r="9" fill="#fff" stroke="#222"/><text x="572" y="700" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">3</text>
<text x="586" y="700" font-weight="bold">Bogie → ring girder</text><text x="586" y="714" font-size="11.5">Spherical pivot on top of the bogie bolts under the ring girder, exactly where a main spoke meets it.</text>
<circle cx="572" cy="726" r="9" fill="#fff" stroke="#222"/><text x="572" y="730" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">4</text>
<text x="586" y="730" font-weight="bold">Spokes → ring girder</text><text x="586" y="744" font-size="11.5">All 12 spokes bolt to the ring girder at their outer ends (main spokes over the 3 bogies).</text>
<circle cx="572" cy="756" r="9" fill="#fff" stroke="#222"/><text x="572" y="760" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">5</text>
<text x="586" y="760" font-weight="bold">Spokes → hub</text><text x="586" y="774" font-size="11.5">Inner ends bolt to the hub's upper and lower rings (moment joints).</text>
<circle cx="572" cy="786" r="9" fill="#fff" stroke="#222"/><text x="572" y="790" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">6</text>
<text x="586" y="790" font-weight="bold">Mast → hub</text><text x="586" y="804" font-size="11.5">The mast foot sits on a spherical seat on top of the hub.</text>
<circle cx="572" cy="816" r="9" fill="#fff" stroke="#222"/><text x="572" y="820" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">7</text>
<text x="586" y="820" font-weight="bold">Hub → kingpin</text><text x="586" y="834" font-size="11.5">A slewing ring on the hub underside fits round the fixed kingpin: centring only, no weight.</text>
<circle cx="572" cy="846" r="9" fill="#fff" stroke="#222"/><text x="572" y="850" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">8</text>
<text x="586" y="850" font-weight="bold">Rail → piers → ground</text><text x="586" y="864" font-size="11.5">The fixed rail (12 segments) sits on 12 levelling piers on sintered pads.</text>
<circle cx="572" cy="876" r="9" fill="#fff" stroke="#222"/><text x="572" y="880" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">9</text>
<text x="586" y="880" font-weight="bold">Kingpin foundation ← ties</text><text x="586" y="894" font-size="11.5">The 3 ground ties from the strut feet end here and cancel out.</text>
<text x="560" y="90" font-size="12"><tspan fill="#e67e22" font-weight="bold">Turns:</tspan> mast, hub, spokes, ring girder, bogies.   <tspan fill="#7d8790" font-weight="bold">Fixed:</tspan> rail, piers, kingpin, ties.</text>
<text x="560" y="108" font-size="12">Weight path: mast → hub → 3 main spokes → ring girder → 3 bogie pivots → 6 tyres → rail → piers → ground.</text>
</svg>