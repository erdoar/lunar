<text x="341" y="397" text-anchor="start">Upper collar 62 m + stay cables</text>
<path d="M260 573L337 554" class="l"/>
<text x="341" y="558" text-anchor="start">Strut collar 35 m + A-frame struts</text>
<path d="M436 786L442 680" class="l"/>
<text x="446" y="684" text-anchor="start">Foot pad, 30 m out</text>
<path d="M287 784L324 720" class="l"/>
<text x="328" y="724" text-anchor="start">Deck + bogies on the</text>
<text x="328" y="738" text-anchor="start">Ø12 m rail (see right)</text>
<text x="30" y="848" font-size="12">Turns (once per lunar day): <tspan fill="#e67e22" font-weight="bold">orange</tspan> + <tspan fill="#2c4a7a" font-weight="bold">blue</tspan>.  Fixed: <tspan fill="#7d8790" font-weight="bold">grey</tspan>, <tspan fill="#4a9" font-weight="bold">green</tspan> collars, purple cables.</text>
<text x="560" y="30" class="t">Base close-up: what attaches to what</text>
<text x="560" y="48" font-size="11.5">Radial section through one bogie, mast centre on the left (vertical scale x2)</text>
<rect x="560" y="560" width="760" height="50" fill="url(#g)"/><line x1="560" y1="560" x2="1323.0" y2="560" stroke="#222"/>
