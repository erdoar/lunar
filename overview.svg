<rect x="792.5" y="367.0" width="135.0" height="10.500000000000002" fill="#e67e22" class="s"/>
<rect x="755.0" y="130.0" width="210.0" height="225.0" fill="none" stroke="#e67e22" stroke-width="4"/>
<rect x="635.0" y="295.0" width="450" height="8" fill="#e67e22" opacity="0.7"/>
<rect x="980.0" y="259.0" width="60" height="36" fill="#7fa3d6" class="s"/>
<rect x="672.5" y="175.0" width="375.0" height="262.5" fill="none" stroke="#2e7d32" stroke-width="2" stroke-dasharray="7 4"/>
<path d="M905 362L1065 332" class="l"/><circle cx="1065" cy="332" r="10" fill="#fff" stroke="#222"/><text x="1065" y="336" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">1</text>
<path d="M910 403L1084 428" class="l"/><circle cx="1084" cy="428" r="10" fill="#fff" stroke="#222"/><text x="1084" y="432" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">2</text>
<path d="M905 445L1075 485" class="l"/><circle cx="1075" cy="485" r="10" fill="#fff" stroke="#222"/><text x="1075" y="489" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">3</text>
<path d="M972 385L1082 340" class="l"/><circle cx="1082" cy="340" r="10" fill="#fff" stroke="#222"/><text x="1082" y="344" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">4</text>
<path d="M1040 298L1100 268" class="l"/><circle cx="1100" cy="268" r="10" fill="#fff" stroke="#222"/><text x="1100" y="272" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">5</text>
<path d="M860 348L690 308" class="l"/><circle cx="690" cy="308" r="10" fill="#fff" stroke="#222"/><text x="690" y="312" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">6</text>
<path d="M725 511L615 551" class="l"/><circle cx="615" cy="551" r="10" fill="#fff" stroke="#222"/><text x="615" y="555" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">7</text>
<path d="M672 235L612 215" class="l"/><circle cx="612" cy="215" r="10" fill="#fff" stroke="#222"/><text x="612" y="219" text-anchor="middle" font-size="11" font-weight="bold" style="stroke:none">8</text>
<circle cx="572" cy="596" r="9" fill="#fff" stroke="#222"/><text x="572" y="600" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">1</text>
<text x="586" y="600" font-weight="bold">Mast → bearing</text><text x="586" y="614" font-size="11.5">The mast foot plate (where the 3 legs meet) bolts to the turning race of the base bearing.</text>
<circle cx="572" cy="628" r="9" fill="#fff" stroke="#222"/><text x="572" y="632" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">2</text>
<text x="586" y="632" font-weight="bold">Base bearing</text><text x="586" y="646" font-size="11.5">Ø0.6 m crossed-roller slewing ring in a swappable cartridge; carries ~9.9 kN.</text>
<circle cx="572" cy="660" r="9" fill="#fff" stroke="#222"/><text x="572" y="664" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">3</text>
<text x="586" y="664" font-weight="bold">Bearing → foundation</text><text x="586" y="678" font-size="11.5">The cartridge sits on a spherical seat (±1°) in the foundation frame on a ~2 x 2 m pad.</text>
<circle cx="572" cy="692" r="9" fill="#fff" stroke="#222"/><text x="572" y="696" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">4</text>
<text x="586" y="696" font-weight="bold">Drive → bearing</text><text x="586" y="710" font-size="11.5">2 self-locking worm motors on the foundation frame drive the ring's internal gear.</text>
<circle cx="572" cy="724" r="9" fill="#fff" stroke="#222"/><text x="572" y="728" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">5</text>
<text x="586" y="728" font-weight="bold">Base frame → mast</text><text x="586" y="742" font-size="11.5">The Ø3 m rotating base frame clamps to the bottom mast section ~1.5 m up (winch, power).</text>
<circle cx="572" cy="756" r="9" fill="#fff" stroke="#222"/><text x="572" y="760" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">6</text>
<text x="586" y="760" font-weight="bold">Slip ring</text><text x="586" y="774" font-size="11.5">Through the bearing's hollow centre: rotor on the mast side, stator in the foundation.</text>
<circle cx="572" cy="788" r="9" fill="#fff" stroke="#222"/><text x="572" y="792" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">7</text>
<text x="586" y="792" font-weight="bold">Ties → foundation</text><text x="586" y="806" font-size="11.5">The 3 ground ties from the strut feet end on lugs on the foundation frame and cancel out.</text>
<circle cx="572" cy="820" r="9" fill="#fff" stroke="#222"/><text x="572" y="824" text-anchor="middle" font-size="10.5" font-weight="bold" style="stroke:none">8</text>
<text x="586" y="824" font-weight="bold">Jack frame</text><text x="586" y="838" font-size="11.5">Bolted to the foundation frame: used for erection, then left for bearing swaps.</text>
<text x="560" y="78" font-size="12"><tspan fill="#e67e22" font-weight="bold">Turns:</tspan> mast, bearing inner race, base frame.   <tspan fill="#7d8790" font-weight="bold">Fixed:</tspan> foundation, seat, bearing housing, drives, ties.</text>
<text x="560" y="96" font-size="12">Weight path: mast → foot plate → base bearing → spherical seat → foundation frame → pad → regolith.</text>
</svg>