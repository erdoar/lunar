<rect x="465" y="302" width="330" height="22" fill="#eee"/>
<text x="470" y="318" font-size="11.5" font-weight="bold">Collar torque</text>
<text x="620" y="318" font-size="11.5" font-weight="bold">Pull at apex</text>
<text x="720" y="318" font-size="11.5" font-weight="bold">Pin couple</text>
<text x="470" y="342" font-size="11.5">10 N·m (normal)</text>
<text x="620" y="342" font-size="11.5">~1.8 N</text>
<text x="720" y="342" font-size="11.5">±4.5 N</text>
<text x="470" y="366" font-size="11.5">200 N·m (interlock)</text>
<text x="620" y="366" font-size="11.5">~36 N</text>
<text x="720" y="366" font-size="11.5">±89 N</text>
<text x="470" y="390" font-size="11.5">500 N·m</text>
<text x="620" y="390" font-size="11.5">~89 N</text>
<text x="720" y="390" font-size="11.5">±223 N</text>
<text x="470" y="420" font-size="11">0.1% pins resolve ~3 N ≈ 7 N·m of collar torque.</text>
<text x="470" y="436" font-size="11">Corrects the earlier "±0.2 kN at 200 N·m".</text>
