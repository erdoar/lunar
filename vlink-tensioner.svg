<text x="420" y="726" text-anchor="end" font-size="12">Bare, held rigid</text>
<rect x="440" y="710" width="520" height="22" fill="#c0392b" opacity="0.85"/>
<text x="970" y="726" font-size="11.5">±2.6 kN (~220 K, ~250 mm)</text>
<text x="420" y="766" text-anchor="end" font-size="12">White-coated, held rigid (power off)</text>
<rect x="570" y="750" width="260" height="22" fill="#e67e22" opacity="0.85"/>
<text x="840" y="766" font-size="11.5">±1.3 kN (~110 K, ~120 mm): 0.2–2.8 kN, never slack</text>
<text x="420" y="806" text-anchor="end" font-size="12">White-coated, servo tensioner on</text>
<rect x="690" y="790" width="20" height="22" fill="#2e7d32" opacity="0.85"/>
<text x="720" y="806" font-size="11.5">±0.1 kN deadband (buffer drift ~7 mm)</text>
<text x="700" y="850" text-anchor="middle" font-size="11">set point 1.5 kN</text>
<text x="20" y="880" font-size="11.5">The CFRP mast and struts barely change length; the steel stays and ties do. A soft spring would absorb it but make the bracing soft against quakes,</text>
<text x="20" y="896" font-size="11.5">so the foot winch stays on as a slow servo (0.5 mm/s; the stay's thermal time constant is ~20 min). Alternative for later: a coated CFRP rod stay (α ≈ 0).</text>
