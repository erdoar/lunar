<text x="216" y="514" text-anchor="end">1. Traction sheave on the</text>
<text x="216" y="529" text-anchor="end">rotating base frame</text>
<path d="M291 330L220 330" class="l"/>
<text x="216" y="334" text-anchor="end">2. Up the clear centre of the</text>
<text x="216" y="349" text-anchor="end">lattice, ceramic guide ring</text>
<text x="216" y="364" text-anchor="end">every 3 m (~23 N rope weight)</text>
<path d="M291 90L220 70" class="l"/>
<text x="216" y="74" text-anchor="end">3. Turning block at</text>
<text x="216" y="89" text-anchor="end">the yard-mast, 100 m</text>
<path d="M500 95L500 140" class="l"/>
