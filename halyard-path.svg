<text x="914" y="229" text-anchor="start">top bar (docks</text>
<text x="914" y="244" text-anchor="start">under the yard)</text>
<text x="420" y="520" font-size="11.5">gearbox + motors</text>
<text x="20" y="620" font-size="12">Base frame, mast and yard turn together: no rope crosses a rotating joint. Flat-pack sections unfold around the 4-rope bundle during jack-up.</text>
