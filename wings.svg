<text x="172" y="259" text-anchor="end">Rope from the reel (0.1 m/s)</text>
<path d="M247 569L176 524" class="l"/>
<text x="172" y="528" text-anchor="end">One pack lowered,</text>
<text x="172" y="542" text-anchor="end">~16 min each way</text>
<path d="M324 441L176 409" class="l"/>
<text x="172" y="413" text-anchor="end">Second bot climbing the rail</text>
<text x="172" y="427" text-anchor="end">inside the mast core</text>
