<text x="172" y="707" text-anchor="end">Lands in its tray slot,</text>
<text x="172" y="721" text-anchor="end">then folds itself up</text>
<path d="M202 764L138 745" class="l"/>
<text x="134" y="749" text-anchor="end">New folded pack</text>
<text x="134" y="763" text-anchor="end">waits by the tray</text>
<path d="M394 130L458 102" class="l"/>
<text x="462" y="106" text-anchor="start">Walkway + fall-arrest rail on the yard</text>
<path d="M420 141L458 159" class="l"/>
<text x="462" y="163" text-anchor="start">16 fixed pack hangers under the yard</text>
<path d="M407 236L458 236" class="l"/>
<text x="462" y="240" text-anchor="start">Starboard wing: 8 packs,</text>
<text x="462" y="254" text-anchor="start">still working</text>
