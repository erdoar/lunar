<path d="M830 294 H1060" class="l" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="945" y="308" text-anchor="middle">1.4 m face</text>
<path d="M985 165L1055 95" class="l"/>
<text x="1059" y="99" text-anchor="start">Clear core ~Ø0.69 m</text>
<text x="1059" y="113" text-anchor="start">(members on faces only)</text>
<path d="M982 211L1055 165" class="l"/>
<text x="1059" y="169" text-anchor="start">Bot ~0.45 x 0.3 m;</text>
<text x="1059" y="183" text-anchor="start">reel slung below</text>
<path d="M957 266L1055 255" class="l"/>
<text x="1059" y="259" text-anchor="start">Climb rail + captive</text>
<text x="1059" y="273" text-anchor="start">fall-arrest trolley</text>
<text x="800" y="355" font-size="11.5">Collars, V-links, stays and spreaders are all outside the</text>
<text x="800" y="370" font-size="11.5">mast, so the climb inside never has to pass them.</text>
<text x="800" y="420" class="t">Pack swap, ~1.3 h with one bot</text>
<text x="800" y="442">1. Park at the maintenance azimuth; new pack to the tray.</text>
<text x="800" y="459">2. Bot climbs inside the mast (~11 min), clips to the yard</text>
<text x="814" y="476">rail and walks out to the station.</text>
<text x="800" y="493">3. Reel into the socket, rope to the pack head; take the</text>
<text x="814" y="510">load, open the hanger latch.</text>
<text x="800" y="527">4. Lower ~16 min: past its neighbours, clear of the collars;</text>
<text x="814" y="544">it lands in its slot and folds itself up.</text>
<text x="800" y="561">5. Rover or crew swaps the folded pack in the tray.</text>
<text x="800" y="578">6. Hoist ~16 min: it unfolds as it lifts; cones seat, bot</text>
<text x="814" y="595">latches, unhooks and climbs down.</text>
<text x="800" y="632" class="t">Balance</text>
<text x="800" y="652">A pack on the rope still hangs from the yard: no change.</text>
<text x="800" y="669">Pack landed: ≤3.6 kN·m; with the bot at the far tip ≤6 kN·m,</text>
<text x="800" y="686">half the ~12 kN·m quake case. First fit alternates sides.</text>
<text x="800" y="703"></text>
<text x="800" y="720" fill="#555">Deleted: halyards, wing winch, trim sheaves, wing top bars,</text>
<text x="800" y="737" fill="#555">docks and ballast pallet. The rest of the array keeps working.</text>
