<text x="172" y="259" text-anchor="end">Two ropes, 0.1 m/s</text>
<path d="M247 569L176 524" class="l"/>
<text x="172" y="528" text-anchor="end">One pack lowered,</text>
<text x="172" y="542" text-anchor="end">~16 min each way</text>
<path d="M324 441L176 409" class="l"/>
<text x="172" y="413" text-anchor="end">Second bot climbing unladen</text>
<text x="172" y="427" text-anchor="end">inside the mast core</text>
<path d="M251 768L176 703" class="l"/>
<text x="172" y="707" text-anchor="end">Lands in its tray slot,</text>
<text x="172" y="721" text-anchor="end">then folds itself up</text>
<path d="M202 764L138 745" class="l"/>
<text x="134" y="749" text-anchor="end">New folded pack</text>
<text x="134" y="763" text-anchor="end">waits by the tray</text>
<path d="M394 130L458 102" class="l"/>
<text x="462" y="106" text-anchor="start">Walkway + fall-arrest rail on the yard</text>
<path d="M420 141L458 159" class="l"/>
<text x="462" y="163" text-anchor="start">16 fixed pack hangers under the yard</text>
<path d="M407 236L458 236" class="l"/>
<text x="462" y="240" text-anchor="start">Starboard wing: 8 packs,</text>
<text x="462" y="254" text-anchor="start">still working</text>
<path d="M339 383L458 370" class="l"/>
<text x="462" y="374" text-anchor="start">Upper collar 62 m</text>
<path d="M339 556L458 543" class="l"/>
<text x="462" y="547" text-anchor="start">Strut collar 35 m</text>
<path d="M426 770L458 690" class="l"/>
<text x="462" y="694" text-anchor="start">Landing trays (8 slots each)</text>
<path d="M340 770L458 788" class="l"/>
<text x="462" y="792" text-anchor="start">Base frame: bot dock + hatch</text>
<text x="800" y="30" class="t">Inside the mast: plan section</text>
