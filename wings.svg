<text x="462" y="374" text-anchor="start">Upper collar 62 m</text>
<path d="M339 556L458 543" class="l"/>
<text x="462" y="547" text-anchor="start">Strut collar 35 m</text>
<path d="M426 770L458 690" class="l"/>
<text x="462" y="694" text-anchor="start">Landing trays (8 slots each)</text>
<path d="M340 770L458 788" class="l"/>
<text x="462" y="792" text-anchor="start">Base frame: bot dock + hatch</text>
<text x="800" y="30" class="t">Inside the mast: plan section</text>
