<text x="970" y="560" font-size="11.5">Raising reverses it: each panel</text>
<text x="970" y="575" font-size="11.5">unfolds as it lifts off the tray.</text>
<text x="20" y="722" font-size="12.5">One winch drives all 4 halyards through linked drums, so both wings always lower, fold, lift and unfold together and the rig stays balanced.</text>
<text x="20" y="740" font-size="12.5">No Roman-blind cords, carriers or per-pack hoists: the packs fold by landing. Down ~20 min, swap, up ~20 min.</text>
