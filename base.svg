<text x="938" y="168" font-size="11">MoS₂/WS₂ metal-matrix composite, 6 mm</text>
<text x="938" y="184" font-size="11">Insulated copper foil layers, 3 sectors each</text>
<rect x="930" y="330" width="310" height="34" fill="#9fb3c8" class="s"/>
<text x="938" y="352" style="stroke:none">Hard ball surface (fixed, grounded)</text>
<path d="M1240 330H1260" class="l"/><text x="1264" y="334" font-size="12" fill="#8a5a2b">running surface</text>
<text x="1264" y="350" font-size="11" fill="#8a5a2b">10-yr wear ~0.001 mm</text>
<text x="930" y="388" font-size="12">When wear reaches a layer it touches the ball: a metal ball shorts</text>
<text x="930" y="404" font-size="12">it to ground; with a ceramic ball each layer is a loop that breaks.</text>
<text x="930" y="420" font-size="12">Normal wear never reaches L1, so ANY trip flags an anomaly</text>
<text x="930" y="436" font-size="12">(galling, contamination, overload). Sector differences show</text>
<text x="930" y="452" font-size="12">uneven wear. Readout on the rotating base frame (11).</text>
<text x="930" y="488" class="t">Key</text>
