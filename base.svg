<text x="956" y="615">Pedestal with conical drip flange</text>
<circle cx="940" cy="632" r="9" fill="#fff" stroke="#222"/><text x="940" y="636" text-anchor="middle" class="n" style="stroke:none">7</text>
<text x="956" y="636">Pin-ring (lantern) gear Ø1.2 m (turns)</text>
<circle cx="940" cy="653" r="9" fill="#fff" stroke="#222"/><text x="940" y="657" text-anchor="middle" class="n" style="stroke:none">8</text>
<text x="956" y="657">Drive cartridges (2): self-locking worm, limiter ~300 N·m (5a)</text>
<circle cx="940" cy="674" r="9" fill="#fff" stroke="#222"/><text x="940" y="678" text-anchor="middle" class="n" style="stroke:none">9</text>
<text x="956" y="678">Annular slip ring Ø0.9 m: rotor turns, stator fixed</text>
<circle cx="940" cy="695" r="9" fill="#fff" stroke="#222"/><text x="940" y="699" text-anchor="middle" class="n" style="stroke:none">10</text>
<text x="956" y="699">Foundation frame, ~2 x 2 m pad, 3 ground-tie lugs</text>
<circle cx="940" cy="716" r="9" fill="#fff" stroke="#222"/><text x="940" y="720" text-anchor="middle" class="n" style="stroke:none">11</text>
<text x="956" y="720">Base frame Ø3 m: battery, bot dock, power, wear readout</text>
<circle cx="940" cy="737" r="9" fill="#fff" stroke="#222"/><text x="940" y="741" text-anchor="middle" class="n" style="stroke:none">12</text>
<text x="956" y="741">Removable enclosure: fixed tub + rotating lid (5a)</text>
<circle cx="940" cy="758" r="9" fill="#fff" stroke="#222"/><text x="940" y="762" text-anchor="middle" class="n" style="stroke:none">13</text>
<text x="956" y="762">Jack frame: erection, then ~10 mm lift for a cup swap</text>
<circle cx="940" cy="779" r="9" fill="#fff" stroke="#222"/><text x="940" y="783" text-anchor="middle" class="n" style="stroke:none">14</text>
<text x="956" y="783">Debris falls off the ball, between the hooks</text>
<circle cx="940" cy="800" r="9" fill="#fff" stroke="#222"/><text x="940" y="804" text-anchor="middle" class="n" style="stroke:none">15</text>
<text x="956" y="804">Bot hatch + climb rail up the mast core</text>
