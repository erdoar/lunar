<text x="484" y="68" text-anchor="start">Drums wind in</text>
<text x="360" y="404" font-size="11.5">Deploy is the reverse: pay out, gravity</text>
<text x="360" y="419" font-size="11.5">unfolds it (~0.1 m/s, ~5 min per pack)</text>
<text x="620" y="34" class="t">3. Stowed stack</text>
