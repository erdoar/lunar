<text x="20" y="744" font-size="12">All CFRP tubes with Ti-6Al-4V nodes; bolted moment joints at the hub (upper/lower rings), bolted to the ring girder. Stresses &lt; 60 MPa: sized by buckling, joints and handling.</text>
