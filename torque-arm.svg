<text x="924" y="584" font-size="12" fill="#c0392b">top pin: ~9 kN tension (fold hinge)</text>
<path d="M920 739.0 H856" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="924" y="743.0" font-size="12" fill="#2e7d32">seat: ~9 kN compression; keeper pin ~0</text>
<path d="M1155.0 641.5 v40" stroke="#8e44ad" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="1161.0" y="671.5" font-size="12" fill="#8e44ad">bridle pull</text>
<path d="M695 610 V715.0" class="l" marker-start="url(#ar)" marker-end="url(#ar)"/><line x1="690" y1="610" x2="830" y2="610" stroke="#999" stroke-dasharray="2 3"/><line x1="690" y1="715.0" x2="830" y2="715.0" stroke="#999" stroke-dasharray="2 3"/>
<text x="690" y="666.5" text-anchor="end" font-size="12" font-weight="bold">500</text><text x="690" y="680.5" text-anchor="end" font-size="12" font-weight="bold">mm</text>
<text x="650" y="760" font-size="11.5">Root moment ~4.6 kN·m per arm at 1.5 kN bridle tension (~19 kN pin loads at 3 kN): 20–25 mm Ti pins.</text>
<text x="660" y="814" font-size="12">Each arm ~30 kg; the V pair folds as one frame on a common hinge axis.</text>
<text x="660" y="830" font-size="12">Folded arms ride up with the collar; the 3 pairs balance, so the collar is not tilted.</text>
