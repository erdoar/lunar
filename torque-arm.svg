<line x1="93.2" y1="309.6" x2="198.0" y2="348.0" stroke="#c87f0a" stroke-width="7"/>
<line x1="198.0" y1="252.0" x2="198.0" y2="348.0" stroke="#c87f0a" stroke-width="2.5"/>
<path d="M88 268 A36.8 36.8 0 0 0 57 265" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="40" y="252" font-size="12">friction drag</text>
<text x="278" y="258.8" font-size="13" fill="#8e44ad" font-weight="bold">+ΔT (leg tightens)</text>
<text x="278" y="353.2" font-size="13" fill="#8e44ad" font-weight="bold">−ΔT (leg slackens)</text>
<path d="M550 310L555 360" class="l"/>
<text x="551" y="364" text-anchor="end">Foot: tensioner +</text>
<text x="551" y="379" text-anchor="end">load cell, 30 m out</text>
<path d="M480 309L420 428" class="l"/>
<text x="416" y="432" text-anchor="end">Split plate (fixed, NOT a pulley),</text>
<text x="416" y="447" text-anchor="end">~12 m up; load pins read ΔT</text>
<path d="M515 300L515 330" class="l"/>
<text x="511" y="334" text-anchor="end">Single main cable</text>
<path d="M198 252L218 212" class="l"/>
<text x="222" y="216" text-anchor="start">Arm tips ±3 m, light tie bar</text>
<path d="M150 330L160 405" class="l"/>
<text x="164" y="409" text-anchor="start">Two hinged arms in a V (CFRP), 8 m</text>
<path d="M93 284L73 412" class="l"/>
<text x="77" y="416" text-anchor="start">Upper collar (stationary),</text>
<text x="77" y="431" text-anchor="start">mast turns inside</text>
<path d="M278 180L308 162" class="l"/>
<text x="312" y="166" text-anchor="start">Wing-lowering plane (30°): tips stay</text>
<text x="312" y="181" text-anchor="start">≥1.4 m clear (tip azimuth 20.6°)</text>
<text x="20" y="495" font-size="12">Dashed: arms after a small twist (exaggerated). One leg tightens and the other slackens, and the split plate</text>
<text x="20" y="511" font-size="12">is pulled sideways against the main cable tension. ~170 kN·m/rad at 1.5 kN, ~250 at 3 kN (all 3 planes):</text>
<text x="20" y="527" font-size="12">~0.17° twist at 500 N·m (partly seized roller). Without arms: ~10°. Raise tension to stiffen.</text>
<text x="660" y="30" class="t">Elevation: hinge, knee brace, latch</text>
<rect x="702" y="60" width="36" height="500" class="mast s"/>
<text x="720" y="76" text-anchor="middle" font-size="11" style="stroke:none" fill="#fff">mast</text>
<rect x="738" y="359.6" width="23.400000000000002" height="32.8" class="collar s"/>
<rect x="678.6" y="359.6" width="23.400000000000002" height="32.8" class="collar s"/>
<line x1="680" y1="240" x2="1162" y2="240" stroke="#2c4a7a" stroke-dasharray="8 5"/><text x="954" y="232" font-size="12">Bottom of array sweep, 67 m (5 m above)</text>
<line x1="757.7" y1="370" x2="928" y2="370" stroke="#c87f0a" stroke-width="5"/>
<line x1="767.7" y1="385.6" x2="928" y2="385.6" stroke="#c87f0a" stroke-width="3"/>
<line x1="765.5" y1="370" x2="779.8" y2="385.6" stroke="#c87f0a" stroke-width="1.5"/>
<line x1="794.1" y1="370" x2="808.4" y2="385.6" stroke="#c87f0a" stroke-width="1.5"/>
<line x1="822.7" y1="370" x2="837.0" y2="385.6" stroke="#c87f0a" stroke-width="1.5"/>
