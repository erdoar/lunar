<path d="M93 284L73 394" class="l"/>
<text x="77" y="398" text-anchor="start">Upper collar (stationary),</text>
<text x="77" y="413" text-anchor="start">mast turns inside</text>
<path d="M278 180L308 162" class="l"/>
<text x="312" y="166" text-anchor="start">Curtain-lowering plane (30°): tips stay</text>
<text x="312" y="181" text-anchor="start">≥1.4 m clear (tip azimuth 20.6°)</text>
<text x="20" y="450" font-size="12">Dashed: arm after a small twist (exaggerated). One wire is stretched and the other slackened;</text>
<text x="20" y="466" font-size="12">their tension difference × 3 m lever resists the twist. Stiffness ~320 kN·m/rad (all 3 arms);</text>
<text x="20" y="482" font-size="12">~0.09° twist at 500 N·m (partly seized roller). Without arms: ~10°.</text>
<text x="660" y="30" class="t">Elevation: hinge, knee brace, latch</text>
<rect x="702" y="60" width="36" height="500" class="mast s"/>
<text x="720" y="76" text-anchor="middle" font-size="11" style="stroke:none" fill="#fff">mast</text>
