<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="1240" height="640" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker></defs>
<style>.s{stroke:#222;stroke-width:2}.l{stroke:#555;stroke-width:1;fill:none}.cab{stroke:#8e44ad;stroke-width:2.5}.collar{fill:#4a9}.mast{fill:#888}.v{fill:#c87f0a;stroke:#222;stroke-width:1.5}text{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.t{font-size:16px;font-weight:bold}</style>
<text x="20" y="32" class="t">1. Plan: how the V-link resists twist</text>
<circle cx="140" cy="300" r="101.5" fill="none" stroke="#4a9" stroke-width="12"/>
<circle cx="140" cy="300" r="66.5" fill="none" stroke="#7d8790" stroke-width="7"/>
<polygon points="196.7,300.0 111.7,349.1 111.6,250.9" fill="none" stroke="#888" stroke-width="4"/>
<polygon points="241.5,286.0 241.5,314.0 270.9,300.0" class="v"/>
<line x1="270.9" y1="300.0" x2="560" y2="300" class="cab"/>
<polygon points="242.4,296.7 239.5,324.5 270.2,313.7" fill="none" stroke="#c87f0a" stroke-width="1.5" stroke-dasharray="4 3"/>
<line x1="270.2" y1="313.7" x2="560" y2="300" stroke="#8e44ad" stroke-width="1.5" stroke-dasharray="6 4"/>
<rect x="550" y="290" width="20" height="20" fill="#555"/>
<path d="M242 215 A133.0 133.0 0 0 0 163 169" fill="none" stroke="#222" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="160" y="160" font-size="12">friction drag</text>
<path d="M271 268 v34" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="279" y="276" font-size="12" fill="#c0392b">cable pulls it back</text>
<path d="M560 310L550 360" class="l"/>
<text x="546" y="364" text-anchor="end">To foot, 30 m out:</text>
<text x="546" y="379" text-anchor="end">one stay cable</text>
<path d="M252 290L180 450" class="l"/>
<text x="184" y="454" text-anchor="start">V-link on 2 close pins</text>
<text x="184" y="469" text-anchor="start">(load pins = torque sensor)</text>
<path d="M140 402L130 500" class="l"/>
<text x="134" y="504" text-anchor="start">Upper collar (stationary)</text>
<text x="20" y="550" font-size="12">Dashed: collar after a small twist (exaggerated). The tensioned cable pulls the</text>
<text x="20" y="566" font-size="12">apex back; the V turns that sideways pull into a couple on its two pins.</text>
<text x="20" y="582" font-size="12">~3.8 kN·m/rad at 1.5 kN (0.15° at normal friction); interlock stops the drive at</text>
<text x="20" y="598" font-size="12">~200 N·m collar torque (≤3° twist).</text>
<text x="580" y="32" class="t">2. Elevation</text>
<rect x="660" y="60" width="60" height="420" class="mast s"/>
<rect x="720" y="174.0" width="54.0" height="66.0" class="collar s"/>
<rect x="606.0" y="174.0" width="54.0" height="66.0" class="collar s"/>
<line x1="780.0" y1="210" x2="830" y2="319" stroke="#c87f0a" stroke-width="9" stroke-linecap="round"/>
<circle cx="780.0" cy="210" r="7" fill="#fff" class="s"/><circle cx="830" cy="319" r="7" fill="none" stroke="#222" stroke-width="2.5"/>
<line x1="830" y1="319" x2="904" y2="480" class="cab"/>
<line x1="780.0" y1="210" x2="780.0" y2="330.0" stroke="#c87f0a" stroke-width="4" stroke-dasharray="6 4"/>
<circle cx="780.0" cy="330.0" r="6" fill="none" stroke="#222" stroke-dasharray="3 2"/>
<path d="M786 206L820 150" class="l"/>
<text x="824" y="154" text-anchor="start">2 close pins (end-on),</text>
<text x="824" y="169" text-anchor="start">free to hinge</text>
<path d="M811 264L870 240" class="l"/>
<text x="874" y="244" text-anchor="start">Tensioned: lines up</text>
<text x="874" y="259" text-anchor="start">with the cable</text>
<path d="M776 294L710 402" class="l"/>
<text x="706" y="406" text-anchor="end">Slack: hangs straight</text>
<text x="706" y="421" text-anchor="end">down under gravity</text>
<path d="M836 319L870 339" class="l"/>
<text x="874" y="343" text-anchor="start">Shackle, 1 m</text>
<text x="874" y="358" text-anchor="start">from the pins</text>
<path d="M880 419L910 440" class="l"/>
<text x="914" y="444" text-anchor="start">Stay cable to</text>
<text x="914" y="459" text-anchor="start">foot (~64°)</text>
<path d="M720 178L750 80" class="l"/>
<text x="754" y="84" text-anchor="start">Upper collar, 62 m</text>
<text x="690" y="76" text-anchor="middle" font-size="11" style="stroke:none" fill="#fff">mast</text>
<text x="1030" y="32" class="t">3. The part</text>
<path d="M1092 120 L1188 120 L1150 310 L1130 310 Z" class="v"/>
<path d="M1112 134 L1168 134 L1140 270 Z" fill="#fff" stroke="#222" stroke-width="1"/>
<circle cx="1100" cy="128" r="6" fill="#fff" stroke="#222" stroke-width="1.5"/>
<circle cx="1180" cy="128" r="6" fill="#fff" stroke="#222" stroke-width="1.5"/>
<circle cx="1140" cy="295" r="8" fill="#fff" stroke="#222" stroke-width="1.5"/>
<path d="M1100 102 H1180" class="l" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="1140" y="96" text-anchor="middle" font-size="12">0.4 m</text>
<path d="M1210 128 V295" class="l" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="1216" y="215" font-size="12">1 m</text>
<path d="M1094 128L1050 170" class="l"/>
<text x="1046" y="174" text-anchor="end">2 pin holes</text>
<text x="1046" y="189" text-anchor="end">(collar lugs)</text>
<path d="M1132 295L1070 335" class="l"/>
<text x="1066" y="339" text-anchor="end">1 shackle hole</text>
<text x="1066" y="354" text-anchor="end">(stay cable)</text>
<text x="1050" y="380" font-size="12">Flat Ti plate, ~8 mm, ~2 kg.</text>
<text x="1050" y="396" font-size="12">Tension only (1.5–3 kN).</text>
<text x="1050" y="412" font-size="12">Fitted and shackled at deck</text>
<text x="1050" y="428" font-size="12">level before jack-up.</text>
</svg>