<line x1="879.9" y1="370" x2="894.2" y2="385.6" stroke="#c87f0a" stroke-width="1.5"/>
<line x1="908.5" y1="370" x2="922.8" y2="385.6" stroke="#c87f0a" stroke-width="1.5"/>
<rect x="922" y="362" width="12" height="31.6" fill="#c87f0a" class="s"/>
<circle cx="757.7" cy="370" r="8" fill="#fff" class="s"/><circle cx="757.7" cy="370" r="3" fill="#222"/>
<rect x="738" y="432.4" width="23.400000000000002" height="14" class="collar s"/>
<line x1="761.6" y1="437.6" x2="850" y2="385.6" stroke="#c87f0a" stroke-width="4"/>
<circle cx="761.6" cy="437.6" r="5" fill="#fff" class="s"/>
<rect x="838" y="383.6" width="24" height="12" fill="#c0392b" class="s"/>
<circle cx="870" cy="399.6" r="5" fill="#f5b700" stroke="#222"/>
<line x1="757.7" y1="370" x2="757.7" y2="198.4" stroke="#c87f0a" stroke-width="4" stroke-dasharray="7 5"/>
<line x1="773.3000000000001" y1="362.2" x2="773.3000000000001" y2="198.4" stroke="#c87f0a" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M777.7 208.79999999999998 A166.4 166.4 0 0 1 909.8 346.6" fill="none" stroke="#222" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<line x1="928" y1="380.4" x2="1054.6153799916976" y2="640" class="guy"/>
<path d="M750 370L660 330" class="l"/>
<text x="656" y="334" text-anchor="end">Hinge pin</text>
<text x="656" y="349" text-anchor="end">(horizontal axis)</text>
<path d="M758 266L777 201" class="l"/>
<text x="781" y="205" text-anchor="start">Folded upright for jack-up</text>
<path d="M863 279L886 258" class="l"/>
<text x="890" y="262" text-anchor="start">Wire tension swings it down</text>
<path d="M862 392L944 427" class="l"/>
<text x="948" y="431" text-anchor="start">Stop + spring latch</text>
<text x="948" y="446" text-anchor="start">(camera target, yellow)</text>
<path d="M806 412L782 510" class="l"/>
<text x="786" y="514" text-anchor="start">Knee brace (pinned), carries</text>
<text x="786" y="529" text-anchor="start">the arm bending</text>
<path d="M750 446L680 479" class="l"/>
<text x="676" y="483" text-anchor="end">Collar lower flange</text>
<path d="M750 367L680 412" class="l"/>
<text x="676" y="416" text-anchor="end">Upper collar, 62 m</text>
<path d="M928 362L944 339" class="l"/>
<text x="948" y="343" text-anchor="start">Tip tie bar (end-on)</text>
<path d="M970 484L990 516" class="l"/>
<text x="994" y="520" text-anchor="start">Bridle leg, down to the</text>
<text x="994" y="535" text-anchor="start">split plate 12 m up</text>
<text x="660" y="724" font-size="12">Each arm ~30 kg; the V pair folds as one frame on a common hinge axis.</text>
<text x="660" y="740" font-size="12">Folded arms ride up with the collar; the 3 pairs balance, so the collar is not tilted.</text>
</svg>