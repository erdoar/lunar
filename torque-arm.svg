<text x="40" y="252" font-size="12">friction drag</text>
<text x="294" y="257.2" font-size="13" fill="#8e44ad" font-weight="bold">+ΔT (stretches)</text>
<text x="294" y="354.8" font-size="13" fill="#8e44ad" font-weight="bold">−ΔT (slackens)</text>
<path d="M550 310L540 350" class="l"/>
<text x="536" y="354" text-anchor="end">Foot pad, 30 m out</text>
<path d="M198 252L218 212" class="l"/>
<text x="222" y="216" text-anchor="start">Crossbar ±3 m (6 m across)</text>
<path d="M150 304L160 375" class="l"/>
<text x="164" y="379" text-anchor="start">Arm, 8 m (CFRP truss)</text>
<path d="M150 270L140 200" class="l"/>
