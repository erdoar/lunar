<text x="660" y="844" font-size="12">Each arm ~30 kg; the V pair folds as one frame on a common hinge axis.</text>
<text x="660" y="860" font-size="12">Folded arms ride up with the collar; the 3 pairs balance, so the collar is not tilted.</text>
