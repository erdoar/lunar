<path d="M750 370L660 330" class="l"/>
<text x="656" y="334" text-anchor="end">Hinge pin</text>
<text x="656" y="349" text-anchor="end">(horizontal axis)</text>
<path d="M758 266L777 201" class="l"/>
<text x="781" y="205" text-anchor="start">Folded upright for jack-up</text>
<path d="M863 279L886 258" class="l"/>
<text x="890" y="262" text-anchor="start">Wire tension swings it down</text>
<path d="M862 392L944 427" class="l"/>
<text x="948" y="431" text-anchor="start">Stop + spring latch</text>
<text x="948" y="446" text-anchor="start">(camera target, yellow)</text>
<path d="M806 412L782 510" class="l"/>
<text x="786" y="514" text-anchor="start">Knee brace (pinned), carries</text>
<text x="786" y="529" text-anchor="start">the arm bending</text>
<path d="M750 446L680 479" class="l"/>
<text x="676" y="483" text-anchor="end">Collar lower flange</text>
<path d="M750 367L680 412" class="l"/>
<text x="676" y="416" text-anchor="end">Upper collar, 62 m</text>
<path d="M928 362L944 339" class="l"/>
<text x="948" y="343" text-anchor="start">Crossbar (end-on)</text>
<path d="M970 484L990 516" class="l"/>
<text x="994" y="520" text-anchor="start">Wire to foot (64° slope);</text>
<text x="994" y="535" text-anchor="start">one from each crossbar end</text>
<text x="660" y="724" font-size="12">Arm ~70 kg (CFRP truss, Ti hinge and latch). Upward-folded arms ride up with the collar during</text>
<text x="660" y="740" font-size="12">jack-up; the 3 arms balance each other, so the collar ring is not tilted.</text>
</svg>