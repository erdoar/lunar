<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="1240" height="760" fill="#fff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker></defs>
<style>.s{stroke:#222;stroke-width:2}.l{stroke:#555;stroke-width:1;fill:none}.guy{stroke:#8e44ad;stroke-width:2}.arm{stroke:#c87f0a}.collar{fill:#4a9}.mast{fill:#888}text{paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.t{font-size:17px;font-weight:bold}</style>
<text x="20" y="30" class="t">Plan: one V pair of arms (of three) and its Y-bridle</text>
<circle cx="70" cy="300" r="23.2" fill="none" stroke="#4a9" stroke-width="7"/><circle cx="70" cy="300" r="15.2" fill="none" stroke="#7d8790" stroke-width="5"/>
